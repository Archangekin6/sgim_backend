{% extends "admin/base_site.html" %} {% block content %}
<h1>{{ title }}</h1>
<p>Compte concerné : <strong>{{ reset_request.user.username }}</strong></p>
{% if reset_request.note %}
<p>Note laissée par l'utilisateur : {{ reset_request.note }}</p>
{% endif %}
<form method="post">
  {% csrf_token %} {{ form.as_p }}
  <input type="submit" value="Réinitialiser le mot de passe" class="default" />
</form>
{% endblock %}
