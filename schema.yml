openapi: 3.0.3
info:
  title: SGIM API
  version: 2.0.0
  description: |-
    API du Système de Gestion des Incidents Maritimes (MRCC Abidjan / MRSC San Pedro).

    **Authentification** : `POST /api/auth/token/` renvoie `access` et `refresh`. Envoyer `Authorization: Bearer <access>` sur chaque requête. L'access expire au bout de 8 h : `POST /api/auth/token/refresh/`.

    **Listes déroulantes** : envoyer l'UUID de l'entrée choisie, jamais son libellé. Les options se lisent sous `/api/references/...`.

    **Listes** : réponse paginée `{count, next, previous, results}` (25 par page). Tri avec `sort` (ex : `-created_at`), recherche avec `search`.

    **Erreurs** : 400 données invalides, 401 non connecté, 403 rôle insuffisant, 404 introuvable.
paths:
  /api/alerts/:
    get:
      operationId: alerts_list
      description: 'Liste paginée. Filtres : status, priority, category, center, channel,
        vessel, call_time_after, call_time_before. Recherche : search. Tri : sort.'
      summary: Lister les alertes
      parameters:
      - in: query
        name: call_time_after
        schema:
          type: string
          format: date-time
      - in: query
        name: call_time_before
        schema:
          type: string
          format: date-time
      - in: query
        name: category
        schema:
          type: string
        description: 'UUID, code (ex : surete) ou nom de la catégorie.'
      - in: query
        name: center
        schema:
          type: integer
      - in: query
        name: channel
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
        description: 'UUID, code (ex : elevee) ou nom de la priorité.'
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - name: sort
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
        description: NEW, QUALIFIED, TRANSMITTED, CLOSED, ou active (tout sauf CLOSED).
          Valeurs multiples séparées par des virgules.
      - in: query
        name: vessel
        schema:
          type: string
          format: uuid
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertListList'
          description: ''
    post:
      operationId: alerts_create
      description: Formulaire « Nouvelle Alerte ». Les champs channel, category, priority,
        severity attendent l'UUID de la liste déroulante. Le numéro, le statut NEW
        et le créateur sont générés par le serveur. Si `center` est omis, le centre
        du compte connecté est utilisé.
      summary: Créer une alerte
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
  /api/alerts/{id}/:
    get:
      operationId: alerts_retrieve
      summary: Détail d'une alerte (personnes et historique inclus)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) alert.
        required: true
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
    put:
      operationId: alerts_update
      summary: Remplacer une alerte
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
    patch:
      operationId: alerts_partial_update
      summary: Modifier partiellement une alerte
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlertDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlertDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlertDetailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
    delete:
      operationId: alerts_destroy
      summary: Supprimer une alerte
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) alert.
        required: true
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/alerts/{id}/change_status/:
    post:
      operationId: alerts_change_status_create
      description: Fait avancer l'alerte et enregistre la transition dans l'historique.
      summary: Changer le statut d'une alerte
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
  /api/alerts/{id}/transmit/:
    post:
      operationId: alerts_transmit_create
      description: Enregistre le partenaire notifié et l'heure exacte de transmission
        (valeur légale).
      summary: Transmettre une alerte à un partenaire
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransmitRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
        '400':
          description: Partenaire inconnu.
  /api/alerts/heatmap/:
    get:
      operationId: alerts_heatmap_retrieve
      description: Renvoie latitude/longitude des alertes situées géographiquement,
        pour construire une carte thermique côté frontend.
      summary: Positions des alertes (carte de densité)
      parameters:
      - in: query
        name: center
        schema:
          type: string
        description: ID du centre pour filtrer.
      - in: query
        name: period
        schema:
          type: integer
        description: Nombre de jours en arrière (défaut 90).
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalide le refresh token. Le front doit aussi supprimer les tokens
        stockés localement.
      summary: Déconnexion
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: Déconnexion réussie.
        '400':
          description: Refresh token manquant ou invalide.
  /api/auth/password-reset-request/:
    post:
      operationId: auth_password_reset_request_create
      description: Endpoint public (sans token). Crée une demande que le Super Admin
        traitera.
      summary: Signaler un mot de passe oublié
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Demande enregistrée.
        '400':
          description: Identifiant inconnu.
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/centers/:
    get:
      operationId: centers_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - name: sort
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      tags:
      - centers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCenterList'
          description: ''
    post:
      operationId: centers_create
      tags:
      - centers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CenterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CenterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
          description: ''
  /api/centers/{id}/:
    get:
      operationId: centers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) center.
        required: true
      tags:
      - centers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
          description: ''
    put:
      operationId: centers_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) center.
        required: true
      tags:
      - centers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CenterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CenterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
          description: ''
    patch:
      operationId: centers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) center.
        required: true
      tags:
      - centers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCenterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCenterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCenterRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
          description: ''
    delete:
      operationId: centers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) center.
        required: true
      tags:
      - centers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/dashboard/alerts-today/:
    get:
      operationId: dashboard_alerts_today_retrieve
      description: 'GET /api/dashboard/alerts-today/ : alertes reçues aujourd''hui.'
      summary: Alertes du jour
      parameters:
      - in: query
        name: center
        schema:
          type: integer
        description: ID du centre (Admin et Super Admin seulement). Un Opérateur voit
          toujours son centre.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsToday'
          description: ''
  /api/dashboard/incidents-open/:
    get:
      operationId: dashboard_incidents_open_retrieve
      description: |-
        GET /api/dashboard/incidents-open/ : alertes non clôturées
        (incident = alerte depuis la fusion de la v2).
      summary: Incidents ouverts
      parameters:
      - in: query
        name: center
        schema:
          type: integer
        description: ID du centre (Admin et Super Admin seulement). Un Opérateur voit
          toujours son centre.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentsOpen'
          description: ''
  /api/dashboard/personnel-available/:
    get:
      operationId: dashboard_personnel_available_retrieve
      description: 'GET /api/dashboard/personnel-available/ : disponibilité des moyens
        de secours.'
      summary: Personnel disponible
      parameters:
      - in: query
        name: center
        schema:
          type: integer
        description: ID du centre (Admin et Super Admin seulement). Un Opérateur voit
          toujours son centre.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonnelAvailable'
          description: ''
  /api/dashboard/stats/by-role/:
    get:
      operationId: dashboard_stats_by_role_retrieve
      description: 'Opérateur : données de son centre. Admin : données globales. Super
        Admin : données globales et indicateurs de gestion des comptes.'
      summary: Statistiques selon le rôle
      parameters:
      - in: query
        name: center
        schema:
          type: integer
        description: ID du centre (Admin et Super Admin seulement). Un Opérateur voit
          toujours son centre.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsByRole'
          description: ''
  /api/event-logs/:
    get:
      operationId: event_logs_list
      description: Lecture seule, réservé aux Admin/Super Admin (§5 spec v2).
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          enum:
          - CREATE
          - ENGAGEMENT
          - LOGIN
          - STATUS_CHANGE
          - TRANSMIT
          - UPDATE
        description: |-
          * `CREATE` - Création
          * `UPDATE` - Modification
          * `STATUS_CHANGE` - Changement de statut
          * `TRANSMIT` - Transmission partenaire
          * `ENGAGEMENT` - Engagement de moyen
          * `LOGIN` - Connexion
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - name: sort
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - event-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventLogList'
          description: ''
  /api/event-logs/{id}/:
    get:
      operationId: event_logs_retrieve
      description: Lecture seule, réservé aux Admin/Super Admin (§5 spec v2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) event log.
        required: true
      tags:
      - event-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLog'
          description: ''
  /api/meetings/:
    get:
      operationId: meetings_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - name: sort
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      tags:
      - meetings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeetingList'
          description: ''
    post:
      operationId: meetings_create
      tags:
      - meetings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
  /api/meetings/{id}/:
    get:
      operationId: meetings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) meeting.
        required: true
      tags:
      - meetings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
    put:
      operationId: meetings_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) meeting.
        required: true
      tags:
      - meetings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
    patch:
      operationId: meetings_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) meeting.
        required: true
      tags:
      - meetings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeetingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeetingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
    delete:
      operationId: meetings_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) meeting.
        required: true
      tags:
      - meetings
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/partners/:
    get:
      operationId: partners_list
      description: Réservé aux Admin/Super Admin - retiré de l'interface opérateur
        (§5 spec v2).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: partner_type
        schema:
          type: string
          format: uuid
