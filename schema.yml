components:
  schemas:
    ActionTypeEnum:
      enum:
      - CREATE
      - UPDATE
      - STATUS_CHANGE
      - TRANSMIT
      - ENGAGEMENT
      - LOGIN
      type: string
      description: |-
        * `CREATE` - Création
        * `UPDATE` - Modification
        * `STATUS_CHANGE` - Changement de statut
        * `TRANSMIT` - Transmission partenaire
        * `ENGAGEMENT` - Engagement de moyen
        * `LOGIN` - Connexion
    AlertDetail:
      type: object
